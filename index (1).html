<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exponential Functions • Differentiation</title>
<script>
window.MathJax={tex:{inlineMath:[['\\(','\\)'],['$','$']]},svg:{fontCache:'global'}};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
<style>
:root{--bg:#071222;--card:#0d2035;--line:#27415e;--text:#f2f6fc;--muted:#a5b5c9;--c:#23dce1;--p:#f54b99;--g:#39c67a}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
.wrap{max-width:820px;margin:auto;padding:22px}.tag{color:var(--c);font-weight:800;font-size:13px}
h1{font-size:29px;margin:8px 0}.sub{color:var(--muted);line-height:1.5}.levels{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:12px 16px;font-weight:800}
button.active{border-color:var(--c);color:var(--c)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:14px}
.math{font-size:27px;margin:14px 0}.q{font-size:18px;line-height:1.5}.ans{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:#07192b;color:white;font-size:17px}
.actions{display:flex;gap:8px;margin-top:12px}.feedback{margin-top:12px;font-weight:700}.hint{color:var(--muted);display:none;margin-top:12px}

</style></head><body><div class="wrap">
<div class="tag">LESSON 3-2 • DIFFERENTIATED QR PRACTICE</div>
<h1 id="title">Exponential Functions</h1>
<div class="sub">Choose the level that fits your learning need. Answers stay hidden until you submit.</div>
<div class="levels"><button id="support" onclick="setLevel('support')">SUPPORT</button><button id="core" onclick="setLevel('core')">CORE</button><button id="challenge" onclick="setLevel('challenge')">CHALLENGE</button></div>
<div class="card"><div class="small" id="levelLabel"></div><div class="math" id="math"></div><div class="q" id="question"></div>
<input id="answer" class="ans" autocomplete="off" placeholder="Type your answer here">
<div class="actions"><button onclick="check()">CHECK</button><button onclick="hint()">HINT</button></div>
<div class="hint" id="hint"></div><div class="feedback" id="feedback"></div></div></div>
<script>
const bank={
1:{title:"Graphing Exponential Functions",
support:{m:"\\\\(f(x)=5^{x}\\\\)",q:"Find \\\\(f(0)\\\\).",a:["1"],h:"Any nonzero base to the zero power equals 1."},
core:{m:"\\\\(f(x)=5^{x}\\\\)",q:"State the horizontal asymptote as an equation.",a:["y=0","y = 0"],h:"Exponential functions of this form approach the x-axis."},
challenge:{m:"\\\\(g(x)=\\\\left(\\\\frac{1}{5}\\\\right)^{x}\\\\)",q:"Is this growth or decay? Type growth or decay.",a:["decay"],h:"Look at the base: it is between 0 and 1."}},
2:{title:"Transformations",
support:{m:"\\\\(y=2^{x+2}-1\\\\)",q:"What is the parent function?",a:["y=2^x","2^x","y=2^x"],h:"Ignore the horizontal and vertical shifts."},
core:{m:"\\\\(y=2^{x+2}-1\\\\)",q:"How many units is the graph shifted left?",a:["2","2 units"],h:"Inside the exponent, the sign works oppositely."},
challenge:{m:"\\\\(y=2^{x+2}-1\\\\)",q:"State the horizontal asymptote.",a:["y=-1","y = -1","-1"],h:"The vertical shift determines the new asymptote."}},
3:{title:"Base e & Reflections",
support:{m:"\\\\(f(x)=e^{x}\\\\)",q:"Is the graph increasing or decreasing?",a:["increasing"],h:"The base e is greater than 1."},
core:{m:"\\\\(f(x)=-e^{-x}\\\\)",q:"Which axis reflection is caused by replacing x with -x?",a:["y-axis","y axis","yaxis"],h:"A negative inside the input reflects horizontally."},
challenge:{m:"\\\\(f(x)=-e^{-x}\\\\)",q:"State the horizontal asymptote.",a:["y=0","y = 0","0"],h:"Reflections do not move the parent asymptote."}},
4:{title:"Compound Interest",
support:{m:"\\\\(A=P\\\\left(1+\\\\frac{r}{n}\\\\right)^{nt}\\\\)",q:"For annual compounding, what is n?",a:["1"],h:"Annual means once per year."},
core:{m:"\\\\(A=P\\\\left(1+\\\\frac{r}{n}\\\\right)^{nt}\\\\)",q:"For quarterly compounding, what is n?",a:["4"],h:"There are four quarters in one year."},
challenge:{m:"\\\\(A=Pe^{rt}\\\\)",q:"Which model is this: periodic or continuous?",a:["continuous","continuous compounding"],h:"The model using e represents continuous compounding."}},
5:{title:"Half-Life Applications",
support:{m:"\\\\(A=A_0\\\\left(\\\\frac12\\\\right)^{t/h}\\\\)",q:"A 2 g sample has a 30-year half-life. How much remains after 30 years? Enter grams.",a:["1","1 g","1g"],h:"After one half-life, half remains."},
core:{m:"\\\\(A=2\\\\left(\\\\frac12\\\\right)^{t/30}\\\\)",q:"How much remains after 60 years? Enter grams.",a:["0.5",".5","0.5 g",".5 g"],h:"60 years is two half-lives."},
challenge:{m:"\\\\(A=2\\\\left(\\\\frac12\\\\right)^{t/30}\\\\)",q:"How much remains after 90 years? Enter grams.",a:["0.25",".25","0.25 g",".25 g","1/4"],h:"90 years is three half-lives."}}
};
const p=new URLSearchParams(location.search); const part=+(p.get('part')||1); let level=p.get('level')||'core';
function norm(s){return s.toLowerCase().replace(/\\s+/g,'').replace(/[,$]/g,'')}
function render(){let b=bank[part]||bank[1],x=b[level];title.textContent=b.title;levelLabel.textContent=level.toUpperCase()+" LEVEL";math.innerHTML=x.m;question.innerHTML=x.q;hint.textContent=x.h;hint.style.display="none";feedback.textContent="";answer.value="";
['support','core','challenge'].forEach(k=>document.getElementById(k).classList.toggle('active',k===level)); if(window.MathJax)MathJax.typesetPromise();}
function setLevel(x){level=x;render()} function hint(){document.getElementById('hint').style.display='block'}
function check(){let x=(bank[part]||bank[1])[level],v=norm(answer.value);let ok=x.a.some(a=>norm(a)===v);feedback.className='feedback '+(ok?'ok':'bad');feedback.textContent=ok?'✓ Correct!':'Not yet. Try again or use the hint.'}
render();
</script></body></html>
